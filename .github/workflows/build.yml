name: Build and Scan Python Service

on:
  push:
    branches:
      - main_test
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Scan (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Python Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Set Backend Host
        run: |
          echo "SPRING_HOST=spring-app" >> $GITHUB_ENV  # Nom du conteneur ou IP publique
          echo "SPRING_PORT=8082" >> $GITHUB_ENV

      - name: Wait for Backend to Start
        run: |
          echo "Waiting for Spring Boot to start..."
          for i in {1..30}; do
            if curl --silent --fail http://$SPRING_HOST:$SPRING_PORT/api/store-polynomial; then
              echo "API is ready!"
              break
            fi
            echo "Waiting for Spring Boot API..."
            sleep 5
          done
          curl http://$SPRING_HOST:$SPRING_PORT/api/store-polynomial || true

      - name: Run Tests and Generate Coverage
        run: |
          pytest tests --cov=app --cov-report=xml || true  # Continuer même si des tests échouent

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml
